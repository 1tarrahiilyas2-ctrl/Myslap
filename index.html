
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner Control</title>
<style>
body {
  background:#10151f;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
h1 {color:#00ff88}
.panel {
  background:#202938;
  padding:20px;
  border-radius:12px;
  margin:15px 0;
}
.test {
  background:#303d50;
  padding:15px;
  border-radius:8px;
}
button {
  background:#00d982;
  color:#07140e;
  border:0;
  padding:13px;
  border-radius:7px;
  font-weight:bold;
  margin-top:12px;
  cursor:pointer;
}
.status {color:#00ff88}
</style>
</head>
<body>

<h1>PLANNER CONTROL</h1>
<p class="status">● DEMO SYSTEM ONLINE</p>

<div class="panel">
<h2>Nederlandse planner</h2>
<p>Donderdag 26 november 2026</p>

<div class="test" id="dutchTest">
  <h3>Actuatoets Nederlands</h3>
  <p>09:15 - 10:05</p>
  <p>Lokaal: G_A208</p>
  <p>Leerkracht: Antonia Van Dijck</p>
</div>

<button onclick="removeTest()">
VERWIJDER ACTUATOETS
</button>

<p id="status"></p>
</div>

<script>
function removeTest() {
  const test = document.getElementById("dutchTest");

  if (test) {
    test.remove();
    document.getElementById("status").textContent =
      "Actuatoets verwijderd uit de lokale demo.";
  }
}
</script>

</body>
</html>
